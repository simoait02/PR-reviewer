rules:
  - id: security-auth-python-route
    languages: [python]
    message: Web entry point requires authorization coverage review.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: |
              @app.route(...)
              def $FUNC(...):
                  ...
          - pattern: |
              @router.$METHOD(...)
              def $FUNC(...):
                  ...

  - id: security-auth-javascript-route
    languages: [javascript, typescript]
    message: Web entry point requires authorization coverage review.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: $APP.get($PATH, $HANDLER)
          - pattern: $APP.post($PATH, $HANDLER)
          - pattern: $APP.put($PATH, $HANDLER)
          - pattern: $APP.patch($PATH, $HANDLER)
          - pattern: $APP.delete($PATH, $HANDLER)

  - id: security-auth-java-controller
    languages: [java]
    message: Controller entry point requires authorization coverage review.
    severity: INFO
    pattern: |
      @$ANNOTATION(...)
      $RET $METHOD(...) { ... }
