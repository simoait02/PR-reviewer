services:
  api:
    image: pr-reviewer-api:ci
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GITHUB_ORCHESTRATOR_MCP_URL: http://mcp:9000/orchestrator/mcp
      GITHUB_REVIEWER_MCP_URL: http://mcp:9000/reviewer/mcp
      PHOENIX_ENABLED: "true"
      PHOENIX_HOST: http://phoenix:6006
      PHOENIX_PROJECT_NAME: pr-reviewer
    depends_on:
      mcp:
        condition: service_started
      phoenix:
        condition: service_started
    ports:
      - "8000:8000"

  mcp:
    image: pr-reviewer-mcp:ci
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: pgvector
      DB_PORT: "5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      pgvector:
        condition: service_started
    ports:
      - "9000:9000"

  phoenix:
    container_name: phoenix
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

  pgvector:
    container_name: pgvector
    image: pgvector/pgvector:0.8.6-pg18-trixie
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_DB: "${DB_NAME:-pr_reviewer}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

volumes:
  pgdata:

secrets:
  postgres_password:
    environment: DB_PASSWORD
