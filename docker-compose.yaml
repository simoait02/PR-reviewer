services:
  pgvector:
    container_name: pgvector
    image: pgvector/pgvector:0.8.6-pg18-trixie
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"

volumes:
  pgdata:
