name: CI pipeline of PR reviewer
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    name: Lint and dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-packages

      - name: Run Ruff lint
        run: uv run --with ruff ruff check .

      - name: Check Ruff formatting
        run: uv run --with ruff ruff format --check .

      - name: Run unit tests with coverage
        run: >-
          uv run --with pytest --with pytest-cov pytest tests/unit
          --cov=agents --cov=api --cov=github_mcp_tools
          --cov-report=term-missing

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit
