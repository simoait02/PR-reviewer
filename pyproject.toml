[project]
name = "pr-reviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "greenlet>=3.5.6",
    "langchain>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-frontmatter>=1.3.0",
    "sqlalchemy>=2.1.0",
]

[tool.uv.workspace]
members = [
    "packages/mcp",
    "packages/agents",
    "packages/api",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/app.py",
    "*/server.py",
]
