[project]
name = "rag"
version = "0.1.0"
description = "Best-practice retrieval and ingestion utilities"
requires-python = ">=3.12"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "openai>=1.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-frontmatter>=1.3.0",
    "sqlalchemy>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
