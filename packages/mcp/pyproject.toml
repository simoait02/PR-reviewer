[project]
name = "github-mcp-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "simoaithssaine09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "fastmcp>=2.3.0rc1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.8.0,<2",
    "openai>=1.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-frontmatter>=1.3.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp = "github_mcp_tools.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
