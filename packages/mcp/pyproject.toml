[project]
name = "github-mcp-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "simoaithssaine09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3.0rc1",
    "httpx>=0.28.1",
    "mcp>=1.8.0,<2",
    "rag",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
rag = { workspace = true }

[project.scripts]
mcp = "github_mcp_tools.server:main"
mcp-reviewer = "github_mcp_tools.domains.reviewer:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
